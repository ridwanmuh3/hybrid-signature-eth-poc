services:
  # ── Ethereum node ──────────────────────────────────────────────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "8540:8540"
    command: >
      anvil
        --host 0.0.0.0
        --port 8540
        --block-gas-limit 50000000
        --accounts 10
        --balance 100
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "http://localhost:8540",
             "-H", "Content-Type: application/json",
             -d, '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}']
      interval: 2s
      timeout: 5s
      retries: 15

  # ── Seed: deploy contract & write .env for oracle ──────────────────
  seed:
    image: ghcr.io/foundry-rs/foundry:latest
    depends_on:
      anvil:
        condition: service_healthy
    volumes:
      - ./apps/ethereum:/workspac./apps/ethereum
      - ./apps/oracle:/workspac./apps/oracle
      - ./scripts:/workspac./scripts
    working_dir: /workspace
    environment:
      ANVIL_RPC: "http://anvil:8540"
      ORACLE_KEY: "0x2a871d0798f97d79848a013d4936a73bf4cc922c825d33c1cf7073dff6d409c6"
      SENDER_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    entrypoint: ["/bin/bash", "/workspac./scripts/seed.sh"]

  # ── Oracle server ──────────────────────────────────────────────────
  oracle:
    build:
      context: ./apps/oracle
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      anvil:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    env_file:
      - ./apps/oracle/.env
    environment:
      ETHEREUM_URL: "http://anvil:8540"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Client ─────────────────────────────────────────────────────────
  client:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_ORACLE_URL: "http://localhost:9000"
        VITE_ETHEREUM_RPC_URL: "http://localhost:8540"
    ports:
      - "5173:80"
    depends_on:
      oracle:
        condition: service_healthy
